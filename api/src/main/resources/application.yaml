server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vision-forge-api
  datasource:
    url: ${VISIONFORGE_DB_URL:jdbc:postgresql://localhost:5432/visionforge}
    username: ${VISIONFORGE_DB_USER:visionforge}
    password: ${VISIONFORGE_DB_PASSWORD:visionforge}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

visionforge:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: visionforge
      audience: visionforge-api
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}
  temporal:
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    task-queue: ${TEMPORAL_TASK_QUEUE:vision-forge}
  model:
    config-secret: ${MODEL_CONFIG_SECRET:}
  billing:
    initial-credit-units: ${BILLING_INITIAL_CREDIT_UNITS:10000}
  composition:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    part-size-bytes: ${COMPOSITION_PART_SIZE_BYTES:8388608}
    timeout: ${COMPOSITION_TIMEOUT:30m}
    presign-ttl: ${COMPOSITION_PRESIGN_TTL:2h}
  storage:
    backend: ${STORAGE_BACKEND:s3}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:visionforge}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: ${STORAGE_PATH_STYLE:true}
    presign-ttl: ${STORAGE_PRESIGN_TTL:15m}
    upload-session-ttl: ${STORAGE_UPLOAD_SESSION_TTL:1h}
    max-upload-bytes: ${STORAGE_MAX_UPLOAD_BYTES:2147483648}
  stream:
    timeout-ms: ${STREAM_TIMEOUT_MS:300000}
  identity:
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrator}
