# Full production-style stack: infrastructure + API + worker + frontend.
#
# Required environment (put them in .env or export them):
#   JWT_SECRET, MODEL_CONFIG_SECRET
#
# STORAGE_PUBLIC_ENDPOINT must be reachable by the browser; change it when the
# object store is published behind a different host or TLS terminator.

services:
  postgres:
    image: postgres:18-alpine
    container_name: visionforge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionforge}
      POSTGRES_USER: ${POSTGRES_USER:-visionforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionforge}
    volumes:
      - visionforge-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: visionforge-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: visionforge-rustfs
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - visionforge-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: visionforge-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-visionforge}
    entrypoint: >
      /bin/sh -c "
      aws configure set default.s3.addressing_style path &&
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$RUSTFS_BUCKET 2>/dev/null ||
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $$RUSTFS_BUCKET
      "
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.29.5
    container_name: visionforge-temporal
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-visionforge}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-visionforge}
      DBNAME: ${TEMPORAL_DB:-temporal}
      VISIBILITY_DBNAME: ${TEMPORAL_VISIBILITY_DB:-temporal_visibility}
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.49.0
    container_name: visionforge-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://localhost:8233}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  migrate:
    image: flyway/flyway:12
    container_name: visionforge-migrate
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visionforge}
      -user=${POSTGRES_USER:-visionforge}
      -password=${POSTGRES_PASSWORD:-visionforge}
      -locations=filesystem:/flyway/sql
      -connectRetries=60
      migrate
    volumes:
      - ./database/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: visionforge-api
    environment:
      VISIONFORGE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visionforge}
      VISIONFORGE_DB_USER: ${POSTGRES_USER:-visionforge}
      VISIONFORGE_DB_PASSWORD: ${POSTGRES_PASSWORD:-visionforge}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-vision-forge}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:?MODEL_CONFIG_SECRET is required}
      BILLING_INITIAL_CREDIT_UNITS: ${BILLING_INITIAL_CREDIT_UNITS:-10000}
      UPSTREAM_USER_AGENT: ${UPSTREAM_USER_AGENT:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${RUSTFS_BUCKET:-visionforge}
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_PATH_STYLE: "true"
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-15m}
      STORAGE_UPLOAD_SESSION_TTL: ${STORAGE_UPLOAD_SESSION_TTL:-1h}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-2147483648}
      CONFIG_REFRESH_INTERVAL_MS: ${CONFIG_REFRESH_INTERVAL_MS:-5000}
      ALERT_ENABLED: ${ALERT_ENABLED:-true}
      ALERT_MAIL_HOST: ${ALERT_MAIL_HOST:-}
      ALERT_MAIL_PORT: ${ALERT_MAIL_PORT:-587}
      ALERT_MAIL_USERNAME: ${ALERT_MAIL_USERNAME:-}
      ALERT_MAIL_PASSWORD: ${ALERT_MAIL_PASSWORD:-}
      ALERT_MAIL_FROM: ${ALERT_MAIL_FROM:-}
      ALERT_MAIL_SSL: ${ALERT_MAIL_SSL:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: visionforge-worker
    environment:
      VISIONFORGE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visionforge}
      VISIONFORGE_DB_USER: ${POSTGRES_USER:-visionforge}
      VISIONFORGE_DB_PASSWORD: ${POSTGRES_PASSWORD:-visionforge}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-vision-forge}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:?MODEL_CONFIG_SECRET is required}
      BILLING_INITIAL_CREDIT_UNITS: ${BILLING_INITIAL_CREDIT_UNITS:-10000}
      UPSTREAM_USER_AGENT: ${UPSTREAM_USER_AGENT:-}
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${RUSTFS_BUCKET:-visionforge}
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_PATH_STYLE: "true"
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-15m}
      STORAGE_UPLOAD_SESSION_TTL: ${STORAGE_UPLOAD_SESSION_TTL:-1h}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-2147483648}
      FFMPEG_PATH: /usr/bin/ffmpeg
      COMPOSITION_PART_SIZE_BYTES: ${COMPOSITION_PART_SIZE_BYTES:-8388608}
      COMPOSITION_TIMEOUT: ${COMPOSITION_TIMEOUT:-30m}
      COMPOSITION_PRESIGN_TTL: ${COMPOSITION_PRESIGN_TTL:-2h}
      WORKER_MAX_CONCURRENT_ACTIVITIES: ${WORKER_MAX_CONCURRENT_ACTIVITIES:-20}
      WORKER_MAX_CONCURRENT_WORKFLOW_TASKS: ${WORKER_MAX_CONCURRENT_WORKFLOW_TASKS:-20}
      WORKER_GRACEFUL_SHUTDOWN_TIMEOUT: ${WORKER_GRACEFUL_SHUTDOWN_TIMEOUT:-30s}
      CONFIG_REFRESH_INTERVAL_MS: ${CONFIG_REFRESH_INTERVAL_MS:-5000}
      ALERT_ENABLED: ${ALERT_ENABLED:-true}
      ALERT_MAIL_HOST: ${ALERT_MAIL_HOST:-}
      ALERT_MAIL_PORT: ${ALERT_MAIL_PORT:-587}
      ALERT_MAIL_USERNAME: ${ALERT_MAIL_USERNAME:-}
      ALERT_MAIL_PASSWORD: ${ALERT_MAIL_PASSWORD:-}
      ALERT_MAIL_FROM: ${ALERT_MAIL_FROM:-}
      ALERT_MAIL_SSL: ${ALERT_MAIL_SSL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: visionforge-frontend
    environment:
      VISIONFORGE_API_BASE_URL: http://api:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  visionforge-postgres-data:
  visionforge-rustfs-data:
